# ============================================================
# Matryoshka ECG - Experiment Configuration
# ============================================================

# --- Project ---
project_name: "matryoshka_ecg"
seed: 42

# --- Dataset ---
dataset:
  name: "ptbxl"
  path: "data/ptbxl_raw"
  sampling_rate: 100          # Use 100Hz version (faster training)
  task: "superdiagnostic"     # 5 superdiagnostic classes: NORM, MI, STTC, CD, HYP
  # Alternative tasks: "diagnostic" (44 classes), "subdiagnostic" (23), "form" (19), "rhythm" (12)
  test_fold: 10               # Official PTB-XL test fold
  val_fold: 9                 # Official PTB-XL validation fold
  # train folds: 1-8
  
# --- Signal Preprocessing ---
preprocessing:
  duration_sec: 10            # ECG duration in seconds  
  num_leads: 12               # 12-lead ECG
  normalize: true             # Z-score normalization per lead
  bandpass_filter: false      # Optional: [0.5, 45] Hz bandpass
  augmentation:
    enabled: true
    random_crop: false
    gaussian_noise_std: 0.01
    random_scale: [0.95, 1.05]
    random_shift: 10          # samples

# --- Model ---
model:
  backbone: "xresnet1d101"    # Options: xresnet1d50, xresnet1d101, inception1d
  input_channels: 12          # 12-lead ECG
  base_embedding_dim: 512     # Full embedding dimension
  num_classes: 5              # 5 superdiagnostic classes
  dropout: 0.3

# --- Matryoshka Representation Learning ---
mrl:
  enabled: true
  nesting_dims: [16, 32, 64, 128, 256, 512]   # Nested dimensions (must divide base_embedding_dim)
  loss_weights: "equal"       # Options: "equal", "linear", "exponential", "learned"
  # If "equal": all dimensions weighted 1.0
  # If "linear": weight proportional to dim
  # If "exponential": weight = 2^(index)

# --- Training ---
training:
  epochs: 50
  batch_size: 128
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.01
  scheduler: "cosine"         # Options: cosine, step, plateau
  warmup_epochs: 5
  label_smoothing: 0.1
  early_stopping_patience: 10
  gradient_clip_norm: 1.0
  num_workers: 4
  pin_memory: true
  mixed_precision: true       # AMP for faster training

# --- Baselines (for comparison) ---
baselines:
  fixed_dim:
    enabled: true
    dims: [16, 32, 64, 128, 256, 512]    # Train separate model per dim
  svd_compression:
    enabled: true                          # Post-hoc SVD on full-dim model
  knowledge_distillation:
    enabled: false                         # Day 3 if time permits
    teacher_dim: 512

# --- Evaluation ---
evaluation:
  metrics: ["macro_auc", "macro_f1", "accuracy", "per_class_auc"]
  retrieval_k: [1, 5, 10, 20]
  compute_flops: true
  compute_params: true
  
# --- Logging ---
logging:
  tensorboard: true
  log_dir: "results/logs"
  checkpoint_dir: "results/checkpoints"
  figure_dir: "results/figures"
  save_best: true
  save_every_n_epochs: 10
